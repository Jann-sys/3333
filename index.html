<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC-1987 工業計算機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --steel-1: #8a8f94;
    --steel-2: #5d6267;
    --steel-3: #3a3e42;
    --steel-4: #24272a;
    --amber: #ffb000;
    --amber-dim: rgba(255, 176, 0, 0.12);
    --safety: #e8701a;
    --safety-dark: #9c4708;
    --alert: #c8281e;
    --alert-dark: #7a120c;
    --hazard-y: #f2c200;
    --hazard-k: #161616;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: 'Oswald', sans-serif;
    background-color: #1b1c1d;
    background-image:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0 1px, transparent 1px 60px),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0 1px, transparent 1px 60px);
    color: #ddd;
    user-select: none;
  }

  /* ===== 機身 ===== */
  .unit {
    position: relative;
    width: 100%;
    max-width: 380px;
    padding: 22px 22px 26px;
    border-radius: 14px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, #9aa0a6 0%, #6b7076 35%, #50555a 70%, #3d4146 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.35),
      inset 0 -3px 0 rgba(0,0,0,0.45),
      inset 0 0 0 1px rgba(0,0,0,0.5),
      0 30px 60px rgba(0,0,0,0.7),
      0 8px 16px rgba(0,0,0,0.5);
  }

  /* 螺絲 */
  .screw {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d9dcdf, #7d8287 55%, #3c3f43 100%);
    box-shadow: inset 0 -1px 1px rgba(0,0,0,0.6), 0 1px 1px rgba(255,255,255,0.3);
  }
  .screw::before, .screw::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 9px; height: 2px; background: #2b2e31;
    transform: translate(-50%, -50%) rotate(var(--r, 35deg));
    border-radius: 1px;
  }
  .screw::after { transform: translate(-50%, -50%) rotate(calc(var(--r, 35deg) + 90deg)); }
  .screw.tl { top: 8px; left: 8px; --r: 20deg; }
  .screw.tr { top: 8px; right: 8px; --r: 70deg; }
  .screw.bl { bottom: 8px; left: 8px; --r: 55deg; }
  .screw.br { bottom: 8px; right: 8px; --r: 10deg; }

  /* 頂部警示條 + 銘牌 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 4px 14px;
  }
  .plate {
    padding: 4px 10px;
    border-radius: 3px;
    background: linear-gradient(180deg, #2a2d30, #1a1c1e);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.25);
    color: #c9ced3;
    letter-spacing: 3px;
    font-size: 13px;
    font-weight: 700;
  }
  .plate small { display: block; font-size: 8px; letter-spacing: 2px; color: #7e858b; font-weight: 500; }

  .power {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; letter-spacing: 2px; color: #24272a; font-weight: 700;
  }
  .led {
    width: 11px; height: 11px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #9dff9d, #1fbf3a 60%, #0b5a18);
    box-shadow: 0 0 8px #2aff55, 0 0 2px #2aff55, inset 0 -1px 1px rgba(0,0,0,0.4);
    animation: pulse 3s ease-in-out infinite;
  }
  .led.err {
    background: radial-gradient(circle at 35% 35%, #ffb3a8, #e0291c 60%, #5e0a05);
    box-shadow: 0 0 10px #ff3a2a;
  }
  @keyframes pulse { 50% { opacity: 0.75; } }

  .hazard {
    height: 10px;
    margin: 0 4px 14px;
    border-radius: 2px;
    background: repeating-linear-gradient(-45deg, var(--hazard-y) 0 10px, var(--hazard-k) 10px 20px);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.25);
  }

  /* ===== 顯示器 ===== */
  .bezel {
    padding: 10px;
    border-radius: 8px;
    background: linear-gradient(180deg, #1c1e20, #2e3135);
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.3);
    margin-bottom: 20px;
  }
  .display {
    position: relative;
    height: 110px;
    padding: 10px 14px;
    border-radius: 4px;
    overflow: hidden;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 40%, #2b1d06, #120c02 75%);
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;
    font-family: 'Share Tech Mono', monospace;
  }
  .display::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(170deg, rgba(255,255,255,0.08), transparent 40%);
    pointer-events: none;
  }
  .ghost {
    position: absolute; right: 14px; bottom: 12px;
    font-size: 44px; color: var(--amber-dim); letter-spacing: 1px;
    white-space: nowrap;
  }
  .expr {
    min-height: 20px;
    font-size: 15px;
    color: rgba(255, 176, 0, 0.55);
    letter-spacing: 1px;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .main {
    position: relative; z-index: 1;
    font-size: 44px;
    line-height: 1.1;
    color: var(--amber);
    text-shadow: 0 0 6px rgba(255,176,0,0.75), 0 0 18px rgba(255,140,0,0.35);
    letter-spacing: 1px;
    white-space: nowrap;
    transition: font-size 0.1s;
  }
  .main.err { color: #ff4a3a; text-shadow: 0 0 8px rgba(255,60,40,0.8); }
  .status {
    position: absolute; top: 8px; left: 12px; z-index: 1;
    font-size: 11px; letter-spacing: 2px; color: rgba(255,176,0,0.5);
  }
  .status .on { color: var(--amber); text-shadow: 0 0 5px rgba(255,176,0,0.7); }

  /* ===== 按鍵 ===== */
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 14px;
    border-radius: 8px;
    background: linear-gradient(180deg, #2c2f33, #383c40);
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.75), 0 1px 0 rgba(255,255,255,0.3);
  }

  .key {
    --face-1: #4a4f54;
    --face-2: #2f3337;
    --edge: #15171a;
    --txt: #e8e8e8;
    position: relative;
    height: 60px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--txt);
    background: linear-gradient(180deg, var(--face-1), var(--face-2));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 -2px 0 rgba(0,0,0,0.3),
      0 5px 0 var(--edge),
      0 7px 10px rgba(0,0,0,0.55);
    transform: translateY(0);
    transition: transform 0.05s, box-shadow 0.05s, filter 0.1s;
    text-shadow: 0 -1px 0 rgba(0,0,0,0.5);
  }
  .key::before {
    /* 凹面質感 */
    content: ""; position: absolute; inset: 6px 8px;
    border-radius: 5px;
    background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(255,255,255,0.05));
    pointer-events: none;
  }
  .key:hover { filter: brightness(1.08); }
  .key:active, .key.pressed {
    transform: translateY(4px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.15),
      inset 0 -1px 0 rgba(0,0,0,0.3),
      0 1px 0 var(--edge),
      0 2px 4px rgba(0,0,0,0.5);
  }
  .key:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  .key.fn   { --face-1: #9ca1a6; --face-2: #6e7378; --edge: #3a3d40; --txt: #1d1f21; font-size: 18px; text-shadow: 0 1px 0 rgba(255,255,255,0.3); }
  .key.op   { --face-1: #f38a3a; --face-2: var(--safety); --edge: var(--safety-dark); --txt: #1d1206; font-size: 26px; text-shadow: 0 1px 0 rgba(255,255,255,0.25); }
  .key.op.active { filter: brightness(1.2); box-shadow: inset 0 0 0 2px #ffd9a8, 0 5px 0 var(--safety-dark), 0 0 14px rgba(255,140,40,0.6); }
  .key.ac   { --face-1: #e2483c; --face-2: var(--alert); --edge: var(--alert-dark); --txt: #fff; font-weight: 700; }
  .key.eq   {
    --face-1: #e2483c; --face-2: var(--alert); --edge: var(--alert-dark); --txt: #fff;
    font-size: 28px; font-weight: 700;
    background:
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.0) 0 8px, rgba(0,0,0,0.12) 8px 16px),
      linear-gradient(180deg, var(--face-1), var(--face-2));
  }
  .key.zero { grid-column: span 2; }

  .footer {
    display: flex; justify-content: space-between;
    margin: 16px 6px 0;
    font-size: 9px; letter-spacing: 2px; color: #2a2d30; font-weight: 700;
  }
  .footer span:last-child { color: #33373b; }

  @media (max-width: 360px) {
    .unit { padding: 18px 14px 22px; }
    .keys { gap: 9px; padding: 11px; }
    .key { height: 54px; font-size: 20px; }
    .main { font-size: 38px; }
  }
</style>
</head>
<body>

<div class="unit">
  <div class="screw tl"></div><div class="screw tr"></div>
  <div class="screw bl"></div><div class="screw br"></div>

  <div class="header">
    <div class="plate">IC-1987<small>HEAVY DUTY CALC</small></div>
    <div class="power"><span>PWR</span><div class="led" id="led"></div></div>
  </div>

  <div class="hazard"></div>

  <div class="bezel">
    <div class="display">
      <div class="status"><span id="memInd">M</span> · <span id="opInd">—</span></div>
      <div class="ghost">8888888888888</div>
      <div class="expr" id="expr">&nbsp;</div>
      <div class="main" id="main">0</div>
    </div>
  </div>

  <div class="keys" id="keys">
    <button class="key ac"  data-action="clear">AC</button>
    <button class="key fn"  data-action="sign">±</button>
    <button class="key fn"  data-action="percent">%</button>
    <button class="key op"  data-op="/">÷</button>

    <button class="key" data-digit="7">7</button>
    <button class="key" data-digit="8">8</button>
    <button class="key" data-digit="9">9</button>
    <button class="key op" data-op="*">×</button>

    <button class="key" data-digit="4">4</button>
    <button class="key" data-digit="5">5</button>
    <button class="key" data-digit="6">6</button>
    <button class="key op" data-op="-">−</button>

    <button class="key" data-digit="1">1</button>
    <button class="key" data-digit="2">2</button>
    <button class="key" data-digit="3">3</button>
    <button class="key op" data-op="+">+</button>

    <button class="key fn" data-action="back">⌫</button>
    <button class="key" data-digit="0">0</button>
    <button class="key" data-action="dot">.</button>
    <button class="key eq" data-action="equals">=</button>
  </div>

  <div class="footer"><span>MADE FOR THE FLOOR</span><span>№ 0042-TW</span></div>
</div>

<script>
(() => {
  const mainEl = document.getElementById('main');
  const exprEl = document.getElementById('expr');
  const opInd  = document.getElementById('opInd');
  const led    = document.getElementById('led');
  const opKeys = document.querySelectorAll('.key.op');

  const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  let current = '0';     // 正在輸入的數字字串
  let prev = null;       // 前一個數值
  let op = null;         // 待運算的運算子
  let fresh = false;     // 下一個數字是否覆蓋 current
  let lastOp = null, lastOperand = null; // 連按 = 重複運算
  let error = false;

  // ---- 機械按鍵音 ----
  let ctx;
  function click(heavy) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const t = ctx.currentTime;
      const len = 0.035;
      const buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = heavy ? 900 : 2200; f.Q.value = 1.2;
      const g = ctx.createGain(); g.gain.value = heavy ? 0.5 : 0.3;
      src.connect(f).connect(g).connect(ctx.destination);
      src.start(t);
    } catch (e) {}
  }

  // ---- 數字格式 ----
  function fmtNumber(n) {
    if (!isFinite(n)) return 'ERROR';
    if (n === 0) return '0';
    const abs = Math.abs(n);
    if (abs >= 1e13 || abs < 1e-9) {
      return n.toExponential(6).replace(/\.?0+e/, 'e');
    }
    const s = parseFloat(n.toPrecision(12)).toString();
    return groupDigits(s);
  }
  function groupDigits(s) {
    const neg = s.startsWith('-');
    if (neg) s = s.slice(1);
    let [int, dec] = s.split('.');
    int = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + int + (dec !== undefined ? '.' + dec : '');
  }

  function render() {
    const text = error ? 'ERROR' : groupDigits(current);
    mainEl.textContent = text;
    mainEl.classList.toggle('err', error);
    led.classList.toggle('err', error);

    // 依長度縮放字級
    const len = text.length;
    const base = window.innerWidth <= 360 ? 38 : 44;
    mainEl.style.fontSize = (len > 10 ? Math.max(20, base * 10 / len) : base) + 'px';

    exprEl.innerHTML = (prev !== null && op) ? fmtNumber(prev) + ' ' + SYM[op] : '&nbsp;';
    opInd.textContent = op ? SYM[op] : '—';
    opInd.className = op ? 'on' : '';
    opKeys.forEach(k => k.classList.toggle('active', k.dataset.op === op && fresh));
  }

  function compute(a, b, o) {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b;
    }
    return b;
  }

  function setResult(n) {
    if (!isFinite(n)) { error = true; current = '0'; prev = null; op = null; return; }
    current = parseFloat(n.toPrecision(12)).toString();
    if (Math.abs(n) >= 1e13 || (Math.abs(n) < 1e-9 && n !== 0)) current = n.toExponential(6);
  }

  function inputDigit(d) {
    if (error) clearAll();
    if (fresh) { current = '0'; fresh = false; }
    const digits = current.replace(/[-.]/g, '').length;
    if (digits >= 13) return;
    current = current === '0' ? d : current === '-0' ? '-' + d : current + d;
  }

  function inputDot() {
    if (error) clearAll();
    if (fresh) { current = '0'; fresh = false; }
    if (!current.includes('.') && !current.includes('e')) current += '.';
  }

  function setOp(o) {
    if (error) return;
    const val = parseFloat(current);
    if (op && !fresh) {
      setResult(compute(prev, val, op));
      if (error) return;
      prev = parseFloat(current);
    } else if (!op || prev === null) {
      prev = val;
    }
    op = o;
    fresh = true;
    lastOp = null;
  }

  function equals() {
    if (error) return;
    const val = parseFloat(current);
    if (op) {
      const b = fresh ? prev : val;
      exprEl.textContent = fmtNumber(prev) + ' ' + SYM[op] + ' ' + fmtNumber(b) + ' =';
      lastOp = op; lastOperand = b;
      setResult(compute(prev, b, op));
      prev = null; op = null;
    } else if (lastOp) {
      exprEl.textContent = fmtNumber(val) + ' ' + SYM[lastOp] + ' ' + fmtNumber(lastOperand) + ' =';
      setResult(compute(val, lastOperand, lastOp));
    }
    fresh = true;
    const keepExpr = exprEl.textContent;
    render();
    if (!error) exprEl.textContent = keepExpr;
  }

  function clearAll() {
    current = '0'; prev = null; op = null; fresh = false;
    lastOp = null; lastOperand = null; error = false;
  }

  function back() {
    if (error) { clearAll(); return; }
    if (fresh) return;
    current = current.length > 1 ? current.slice(0, -1) : '0';
    if (current === '-' || current === '') current = '0';
  }

  function sign() {
    if (error) return;
    if (current === '0') { current = '-0'; fresh = false; return; }
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
  }

  function percent() {
    if (error) return;
    const val = parseFloat(current);
    // 加減時取前值百分比（如 200 + 10% = 220），其餘直接 /100
    const n = (prev !== null && (op === '+' || op === '-')) ? prev * val / 100 : val / 100;
    setResult(n);
    fresh = false;
  }

  function handle(btn) {
    if (!btn) return;
    const { digit, op: o, action } = btn.dataset;
    click(!!o || action === 'equals' || action === 'clear');
    if (digit !== undefined) inputDigit(digit);
    else if (o) setOp(o);
    else if (action === 'dot') inputDot();
    else if (action === 'clear') clearAll();
    else if (action === 'back') back();
    else if (action === 'sign') sign();
    else if (action === 'percent') percent();
    else if (action === 'equals') { equals(); return; }
    render();
  }

  document.getElementById('keys').addEventListener('click', e => handle(e.target.closest('.key')));

  // ---- 鍵盤支援 ----
  const keyMap = {
    'Enter': '[data-action="equals"]', '=': '[data-action="equals"]',
    'Backspace': '[data-action="back"]', 'Escape': '[data-action="clear"]', 'Delete': '[data-action="clear"]',
    '.': '[data-action="dot"]', ',': '[data-action="dot"]', '%': '[data-action="percent"]',
    '+': '[data-op="+"]', '-': '[data-op="-"]', '*': '[data-op="*"]', 'x': '[data-op="*"]', '/': '[data-op="/"]'
  };
  document.addEventListener('keydown', e => {
    let sel = /^[0-9]$/.test(e.key) ? `[data-digit="${e.key}"]` : keyMap[e.key];
    if (!sel) return;
    e.preventDefault();
    const btn = document.querySelector(sel);
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 90);
    handle(btn);
  });

  render();
})();
</script>
</body>
</html>
