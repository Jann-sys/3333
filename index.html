<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IND-700 工業風計算機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#ffb03a;
    --green:#8dffbb;
    --metal-1:#2f353f;
    --metal-2:#1c2027;
    --metal-3:#101318;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    display:grid;
    place-items:center;
    padding:44px 18px;
    background:
      radial-gradient(circle at 50% -10%, #262c37 0%, #0b0d11 58%),
      #0b0d11;
    color:#cfd6e0;
    font-family:'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* 背景網格 */
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(circle at 50% 38%, #000 15%, transparent 72%);
    mask-image:radial-gradient(circle at 50% 38%, #000 15%, transparent 72%);
    pointer-events:none;
  }

  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    position:relative;
    z-index:1;
  }

  /* ============ 機身 ============ */
  .calc{
    position:relative;
    width:min(372px, 100%);
    padding:24px 22px 20px;
    border-radius:20px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 26%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.014) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, var(--metal-1) 0%, var(--metal-2) 46%, var(--metal-3) 100%);
    box-shadow:
      0 0 0 1px #05070a,
      0 0 0 7px #1a1e24,
      0 0 0 8px #08090c,
      0 36px 64px -12px rgba(0,0,0,.92),
      0 0 70px -20px rgba(255,176,58,.18),
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 -2px 8px rgba(0,0,0,.65);
  }

  /* 螺絲 */
  .screw{
    position:absolute;
    width:12px; height:12px;
    border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #737d8c, #2b313a 58%, #121519);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.75),
      0 1px 2px rgba(0,0,0,.9),
      0 0 0 1px rgba(255,255,255,.05);
  }
  .screw::after{
    content:'';
    position:absolute; inset:0; margin:auto;
    width:7px; height:1.5px;
    background:#0a0c0f;
    border-radius:1px;
    transform:rotate(45deg);
    box-shadow:0 0 0 .5px rgba(255,255,255,.09);
  }
  .tl{ top:11px; left:11px; }
  .tr{ top:11px; right:11px; transform:rotate(70deg); }
  .bl{ bottom:11px; left:11px; transform:rotate(20deg); }
  .br{ bottom:11px; right:11px; transform:rotate(-35deg); }

  /* ============ 頂列 ============ */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 15px;
  }
  .plate{
    font-size:11px;
    letter-spacing:.24em;
    color:#93a0b2;
    padding:5px 11px 5px 9px;
    border-radius:5px;
    border-left:3px solid var(--amber);
    background:linear-gradient(180deg,#242a32,#161a20);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      0 1px 3px rgba(0,0,0,.7);
  }
  .meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:10px;
    letter-spacing:.2em;
    color:#6d7686;
  }
  .led{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green), 0 0 18px rgba(125,255,178,.55);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.32; }
  }

  /* ============ 顯示器 ============ */
  .display{
    position:relative;
    border-radius:10px;
    padding:14px 16px 12px;
    margin-bottom:18px;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(125,255,178,.055), rgba(0,0,0,0) 42%),
      radial-gradient(ellipse at 50% 0%, #0e2319 0%, #050d09 76%);
    box-shadow:
      inset 0 2px 16px rgba(0,0,0,.95),
      inset 0 0 44px rgba(125,255,178,.055),
      0 0 0 1px #0a1210,
      0 1px 0 rgba(255,255,255,.07);
  }
  .display::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(118deg, rgba(255,255,255,.075) 0%, rgba(255,255,255,0) 34%);
    pointer-events:none;
  }
  .display::after{
    content:'';
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.3) 0 1px, transparent 1px 3px);
    opacity:.5;
    pointer-events:none;
  }

  .history{
    height:17px;
    font-size:12px;
    line-height:17px;
    text-align:right;
    letter-spacing:.06em;
    color:rgba(125,255,178,.45);
    white-space:nowrap;
    overflow:hidden;
    position:relative;
    z-index:1;
  }

  .output{
    font-size:42px;
    line-height:1.16;
    text-align:right;
    letter-spacing:.01em;
    color:var(--green);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:
      0 0 6px rgba(125,255,178,.8),
      0 0 24px rgba(125,255,178,.35);
    transition:font-size .12s ease, color .15s ease, text-shadow .15s ease;
    position:relative;
    z-index:1;
  }
  .output.error{
    color:#ff6f60;
    text-shadow:0 0 8px rgba(255,90,70,.85), 0 0 26px rgba(255,90,70,.35);
  }

  /* ============ 鍵盤 ============ */
  .keys{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:11px;
  }

  .keys button{
    position:relative;
    border:none;
    border-radius:9px;
    padding:17px 0;
    font-family:inherit;
    font-size:19px;
    color:#c8d1dd;
    cursor:pointer;
    user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    background:linear-gradient(180deg, #464f5c 0%, #2a2f38 46%, #1b1f25 100%);
    box-shadow:
      0 4px 0 #0c0e12,
      0 6px 11px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.19),
      inset 0 -1px 0 rgba(0,0,0,.55);
    transition:transform .06s ease, box-shadow .06s ease, background .15s ease, color .15s ease;
  }

  .keys button:hover{
    background:linear-gradient(180deg, #505a69 0%, #313740 46%, #20252c 100%);
  }

  .keys button:active,
  .keys button.pressed{
    transform:translateY(4px);
    box-shadow:
      0 0 0 #0c0e12,
      0 1px 3px rgba(0,0,0,.65),
      inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* 功能鍵 */
  .keys button.fn{
    font-size:16px;
    color:#9dafc4;
    background:linear-gradient(180deg, #3a424e 0%, #232830 50%, #171b21 100%);
  }
  .keys button.fn:hover{
    background:linear-gradient(180deg, #444d5b 0%, #2a3038 50%, #1c2027 100%);
  }

  /* 運算鍵 */
  .keys button.op{
    font-size:22px;
    color:#ffc46b;
    background:linear-gradient(180deg, #4b4534 0%, #302d22 50%, #1f1d16 100%);
    box-shadow:
      0 4px 0 #0c0e12,
      0 6px 11px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,190,90,.24),
      inset 0 -1px 0 rgba(0,0,0,.55);
  }
  .keys button.op:hover{
    background:linear-gradient(180deg, #5c5540 0%, #3b3729 50%, #262317 100%);
  }
  .keys button.op.active{
    color:#12140f;
    background:linear-gradient(180deg, #ffd08a 0%, #ffb03a 55%, #d98d21 100%);
    box-shadow:
      0 4px 0 #0c0e12,
      0 0 20px rgba(255,180,70,.45),
      inset 0 1px 0 rgba(255,255,255,.55);
    text-shadow:none;
  }

  /* 等號 */
  .keys button.eq{
    font-size:22px;
    color:#0d1310;
    background:linear-gradient(180deg, #a4ffcc 0%, #4bd693 52%, #1e9c5e 100%);
    box-shadow:
      0 4px 0 #0a3d24,
      0 6px 16px rgba(60,220,140,.3),
      inset 0 1px 0 rgba(255,255,255,.55);
    text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .keys button.eq:hover{
    background:linear-gradient(180deg, #b6ffd8 0%, #5ce4a1 52%, #23a966 100%);
  }
  .keys button.eq:active,
  .keys button.eq.pressed{
    transform:translateY(4px);
    box-shadow:
      0 0 0 #0a3d24,
      0 1px 4px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.18);
  }

  /* ============ 警示條 ============ */
  .hazard{
    height:7px;
    margin-top:20px;
    border-radius:4px;
    opacity:.55;
    background:repeating-linear-gradient(-45deg,
      var(--amber) 0 9px,
      #171a1f 9px 18px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -1px 0 rgba(0,0,0,.7);
  }

  /* ============ 提示 ============ */
  .hint{
    font-size:11px;
    letter-spacing:.13em;
    color:#545e6d;
    text-align:center;
    line-height:1.7;
  }
  .hint b{
    color:#8b97a8;
    font-weight:normal;
  }

  @media (max-width:400px){
    .calc{ padding:20px 17px 17px; border-radius:17px; }
    .keys{ gap:9px; }
    .keys button{ padding:15px 0; font-size:17px; }
    .output{ font-size:36px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="calc">
    <span class="screw tl"></span>
    <span class="screw tr"></span>
    <span class="screw bl"></span>
    <span class="screw br"></span>

    <div class="topbar">
      <div class="plate">IND-700</div>
      <div class="meta">
        <span class="led"></span>
        <span>PWR</span>
      </div>
    </div>

    <div class="display">
      <div class="history">&nbsp;</div>
      <div class="output">0</div>
    </div>

    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="back">⌫</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="÷">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="×">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="−">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="fn" data-action="sign">±</button>
      <button data-num="0">0</button>
      <button data-action="dot">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>

    <div class="hazard"></div>
  </div>

  <p class="hint">
    支援鍵盤輸入 · <b>0-9</b> <b>.</b> <b>+</b> <b>-</b> <b>*</b> <b>/</b> <b>Enter</b> <b>Backspace</b> <b>Esc</b>
  </p>
</div>

<script>
(function(){
  'use strict';

  const outputEl  = document.querySelector('.output');
  const historyEl = document.querySelector('.history');
  const keysEl    = document.querySelector('.keys');

  /* ---- 狀態 ---- */
  let display        = '0';     // 目前顯示的字串
  let firstOperand   = null;    // 前一個運算元（數字）
  let operator       = null;    // 目前運算子
  let waitingForNext = false;   // 是否等待輸入第二個運算元
  let errored        = false;   // 錯誤狀態
  let lastExpression = '';      // 歷史列文字

  /* ---- 運算表 ---- */
  const OPS = {
    '+': (a, b) => a + b,
    '−': (a, b) => a - b,
    '×': (a, b) => a * b,
    '÷': (a, b) => (b === 0 ? NaN : a / b)
  };

  /* ---- 數字格式化 ---- */
  function fmt(n){
    if (!isFinite(n) || Number.isNaN(n)) return 'ERROR';
    const rounded = parseFloat(n.toPrecision(12));
    let s = String(rounded);
    if (s.replace('-', '').replace('.', '').length > 14) {
      s = rounded.toExponential(6);
    }
    return s;
  }

  /* ---- 畫面渲染 ---- */
  function render(){
    outputEl.textContent = display;
    outputEl.classList.toggle('error', errored);
    historyEl.textContent = lastExpression || '\u00A0';

    const len = display.length;
    if (errored)        outputEl.style.fontSize = '34px';
    else if (len > 13)  outputEl.style.fontSize = '21px';
    else if (len > 10)  outputEl.style.fontSize = '27px';
    else if (len > 7)   outputEl.style.fontSize = '34px';
    else                outputEl.style.fontSize = '42px';

    // 運算子高亮
    document.querySelectorAll('.op').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.op === operator && waitingForNext);
    });
  }

  /* ---- 重置 ---- */
  function resetAll(){
    display = '0';
    firstOperand = null;
    operator = null;
    waitingForNext = false;
    errored = false;
    lastExpression = '';
    render();
  }

  /* ---- 錯誤 ---- */
  function showError(){
    display = 'ERROR';
    errored = true;
    firstOperand = null;
    operator = null;
    waitingForNext = false;
    lastExpression = '';
    render();
  }

  /* ---- 輸入數字 ---- */
  function inputDigit(d){
    if (errored) resetAll();

    if (waitingForNext){
      display = d;
      waitingForNext = false;
    } else if (display === '0'){
      display = d;
    } else if (display === '-0'){
      display = '-' + d;
    } else {
      const digits = display.replace(/[-.]/g, '').length;
      if (digits < 12) display += d;
    }
    render();
  }

  /* ---- 小數點 ---- */
  function inputDot(){
    if (errored) resetAll();

    if (waitingForNext){
      display = '0.';
      waitingForNext = false;
    } else if (!display.includes('.')){
      display += '.';
    }
    render();
  }

  /* ---- 正負號 ---- */
  function toggleSign(){
    if (errored) return;
    if (display === '0' || display === 'ERROR') return;
    display = display.startsWith('-') ? display.slice(1) : '-' + display;
    render();
  }

  /* ---- 百分比 ---- */
  function percent(){
    if (errored) return;
    const v = parseFloat(display) / 100;
    display = fmt(v);
    waitingForNext = false;
    render();
  }

  /* ---- 退格 ---- */
  function backspace(){
    if (errored){ resetAll(); return; }
    if (waitingForNext) return;

    if (display.length > 1){
      display = display.slice(0, -1);
      if (display === '-' || display === '') display = '0';
    } else {
      display = '0';
    }
    render();
  }

  /* ---- 選擇運算子 ---- */
  function chooseOperator(op){
    if (errored) return;

    const value = parseFloat(display);

    // 連續按運算子 → 只替換運算子
    if (operator && waitingForNext){
      operator = op;
      lastExpression = fmt(firstOperand) + ' ' + operator;
      render();
      return;
    }

    if (firstOperand === null){
      firstOperand = value;
    } else if (operator){
      const result = OPS[operator](firstOperand, value);
      if (!isFinite(result) || Number.isNaN(result)){ showError(); return; }
      display = fmt(result);
      firstOperand = parseFloat(display);
    }

    operator = op;
    waitingForNext = true;
    lastExpression = fmt(firstOperand) + ' ' + operator;
    render();
  }

  /* ---- 等於 ---- */
  function equals(){
    if (errored) return;
    if (operator === null || firstOperand === null) return;

    const a = firstOperand;
    const b = waitingForNext ? a : parseFloat(display);
    const result = OPS[operator](a, b);

    if (!isFinite(result) || Number.isNaN(result)){ showError(); return; }

    lastExpression = fmt(a) + ' ' + operator + ' ' + fmt(b) + ' =';
    display = fmt(result);
    firstOperand = null;
    operator = null;
    waitingForNext = false;
    render();
  }

  /* ---- 按鈕分派 ---- */
  function handleButton(btn){
    if (btn.dataset.num !== undefined){
      inputDigit(btn.dataset.num);
    } else if (btn.dataset.op){
      chooseOperator(btn.dataset.op);
    } else {
      switch (btn.dataset.action){
        case 'dot':     inputDot();    break;
        case 'equals':  equals();      break;
        case 'clear':   resetAll();    break;
        case 'back':    backspace();   break;
        case 'percent': percent();     break;
        case 'sign':    toggleSign();  break;
      }
    }
  }

  /* ---- 點擊事件 ---- */
  keysEl.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if (btn) handleButton(btn);
  });

  /* ---- 鍵盤支援 ---- */
  function flash(btn){
    if (!btn) return;
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 110);
  }

  document.addEventListener('keydown', function(e){
    const k = e.key;
    let selector = null;

    if (/^[0-9]$/.test(k))                    selector = '[data-num="' + k + '"]';
    else if (k === '.')                       selector = '[data-action="dot"]';
    else if (k === '+')                       selector = '[data-op="+"]';
    else if (k === '-')                       selector = '[data-op="−"]';
    else if (k === '*' || k.toLowerCase() === 'x') selector = '[data-op="×"]';
    else if (k === '/'){                      selector = '[data-op="÷"]'; e.preventDefault(); }
    else if (k === 'Enter' || k === '='){     selector = '[data-action="equals"]'; e.preventDefault(); }
    else if (k === 'Backspace')               selector = '[data-action="back"]';
    else if (k === 'Escape' || k === 'Delete')selector = '[data-action="clear"]';
    else if (k === '%')                       selector = '[data-action="percent"]';
    else return;

    const btn = document.querySelector(selector);
    if (btn){
      handleButton(btn);
      flash(btn);
    }
  });

  /* ---- 初始化 ---- */
  render();
})();
</script>
</body>
</html>
